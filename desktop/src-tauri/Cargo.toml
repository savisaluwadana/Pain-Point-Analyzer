[package]
name = "discovery-lab-desktop"
version = "0.1.0"
description = "Open Source Discovery Lab local desktop research application"
authors = ["Open Source Discovery Lab contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[profile.release]
strip = true
lto = true
