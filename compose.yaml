services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: pain_intelligence
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pain -d pain_intelligence"]
      interval: 5s
      timeout: 4s
      retries: 12
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pain:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pain_intelligence
      PORT: 4000
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_REDIRECT_URI: ${REDDIT_REDIRECT_URI:-http://localhost:3000/api/auth/reddit/callback}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-}
      REDDIT_API_APPROVED: ${REDDIT_API_APPROVED:-false}
      REDDIT_REQUESTS_PER_MINUTE: ${REDDIT_REQUESTS_PER_MINUTE:-30}
      REDDIT_USER_REQUESTS_PER_MINUTE: ${REDDIT_USER_REQUESTS_PER_MINUTE:-10}
      REDDIT_RETENTION_DAYS: ${REDDIT_RETENTION_DAYS:-7}
      TOKEN_ENCRYPTION_KEY_HEX: ${TOKEN_ENCRYPTION_KEY_HEX:?generate a 32-byte hex key}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api
volumes:
  postgres-data:
